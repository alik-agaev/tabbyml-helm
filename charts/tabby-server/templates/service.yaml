apiVersion: v1
kind: Service
metadata:
  name: {{ include "tabby-server.fullname" . }}
  labels:
    app: {{ include "tabby-server.name" . }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ include "tabby-server.name" . }}
